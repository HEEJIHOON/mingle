<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 정보 | rululala</title>
<!-- Pages caches fixed asset URLs. loader.js gives each page load fresh local CSS/JS URLs. -->
<script src="loader.js" data-scripts="common.js,mypage.js"></script>
<noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
<section><div class="w auth">
  <h2>내 정보</h2>
  <p class="note" id="welcome" role="status" hidden>가입을 환영해요! 도시와 자기소개를 채우면 친구가 나를 알아보기 쉬워요.</p>
  <form id="profile-form">
    <div class="field"><label for="p-nick">닉네임</label><input id="p-nick" maxlength="20" required placeholder="닉네임" autocomplete="nickname" disabled></div>
    <div class="field"><label for="p-city">주로 여행하고 싶은 도시</label><input id="p-city" maxlength="50" placeholder="예: 도쿄" disabled></div>
    <div class="field"><label for="p-bio">자기소개</label><textarea id="p-bio" maxlength="300" placeholder="나를 소개해 주세요" disabled></textarea></div>
    <button class="btn" type="submit" id="p-submit" disabled>불러오는 중…</button>
  </form>
  <p id="p-status" role="status"></p>
  <p class="note" id="p-email"></p>
  <p class="switch"><button type="button" id="p-logout" class="btn btn-line">로그아웃</button></p>
</div></section>

</body>
</html>
