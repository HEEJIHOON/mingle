<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>친구 찾기 | rululala</title>
<!-- Pages caches fixed asset URLs. loader.js gives each page load fresh local CSS/JS URLs. -->
<script src="loader.js" data-scripts="common.js,friends.js"></script>
<noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
<section><div class="w">
  <h2>여행 친구를 찾아보세요</h2>
  <div class="fb" role="search">
    <input id="q" type="search" placeholder="닉네임, 도시, 소개 검색" aria-label="검색">
  </div>
  <div class="tools">
    <button class="pill" data-act="safety">🛡️ 안전 센터</button>
    <a class="pill" href="mypage.html">내 정보</a>
    <span id="me"></span>
  </div>
  <h3 style="margin:18px 0 10px">실제 가입자</h3>
  <div class="people" id="members" aria-live="polite"></div>
  <h3 style="margin:26px 0 10px">예시 친구 <span class="meta">(데모)</span></h3>
  <p class="note" style="margin:0 0 10px">아래 필터와 별점·인증 표시는 예시 친구에만 적용돼요. 실제 가입자에게는 해당 데이터가 없어요.</p>
  <div class="fb">
    <select id="city" aria-label="예시 도시 필터"><option value="">모든 도시</option></select>
    <select id="tag" aria-label="예시 관심사 필터"><option value="">모든 관심사</option><option>맛집</option><option>카페</option><option>산책</option><option>전시</option><option>사진</option><option>쇼핑</option><option>등산</option></select>
    <select id="min" aria-label="예시 최소 별점"><option value="0">모든 별점</option><option value="4">★ 4점 이상</option><option value="4.5">★ 4.5점 이상</option></select>
    <select id="sort" aria-label="예시 정렬"><option value="rec">추천순</option><option value="rating">평점순</option><option value="reviews">후기 많은 순</option></select>
  </div>
  <div class="tools">
    <label class="meta"><input id="ver" type="checkbox"> 인증 표시 프로필만</label>
  </div>
  <div class="people" id="grid" aria-live="polite"></div>
  <p class="note" style="margin-top:20px">※ 프로필, 별점, 인증 표시는 모두 예시 데이터이며 실제 신원 확인이 아니에요. 후기·메시지·차단은 이 브라우저에만 저장되는 데모예요.</p>
</div></section>

<div id="modal" role="dialog" aria-modal="true"><div id="modalBox"></div></div>

</body>
                                                                                                                                                                                                     </html>
