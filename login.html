<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 | rululala</title>
<!-- Pages caches fixed asset URLs. loader.js gives each page load fresh local CSS/JS URLs. -->
<script src="loader.js" data-scripts="common.js,auth.js"></script>
<noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
<section><div class="w auth">
  <h2 id="auth-title">로그인</h2>
  <form id="auth-form">
    <input id="a-nick" maxlength="20" placeholder="닉네임" autocomplete="nickname" hidden>
    <input id="a-email" type="email" required placeholder="이메일" autocomplete="email">
    <input id="a-pw" type="password" required minlength="6" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    <button class="btn" type="submit" id="a-submit">로그인</button>
  </form>
  <p id="auth-status" role="status"></p>
  <p class="switch"><span id="switch-text">계정이 없나요?</span> <button type="button" id="switch-btn" class="link">회원가입</button></p>
</div></section>

</body>
</html>
