<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 | Mingle</title>
<link rel="stylesheet" href="style.css">
<script>try{if(localStorage.getItem('sb-knnjrjtdmbgubhoylrob-auth-token'))document.documentElement.classList.add('in')}catch(e){}</script>
</head>
<body>
<div class="hero mini">
  <header><div class="w">
    <a class="logo" href="index.html">Mingle</a>
    <nav><a href="index.html">홈</a><a href="login.html" id="auth-link" aria-current="page">로그인</a><a href="friends.html">친구 찾기</a><a href="world.html">도시</a><a href="stay.html">숙소</a><a href="safe.html">안전</a></nav>
  </div></header>
</div>

<section><div class="w auth">
  <h2 id="auth-title">로그인</h2>
  <form id="auth-form">
    <input id="a-nick" maxlength="20" placeholder="닉네임" autocomplete="nickname" hidden>
    <input id="a-email" type="email" required placeholder="이메일" autocomplete="email">
    <input id="a-pw" type="password" required minlength="6" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    <button class="btn" type="submit" id="a-submit">로그인</button>
  </form>
  <p id="auth-status" role="status"></p>
  <p class="switch"><span id="switch-text">계정이 없나요?</span> <button type="button" id="switch-btn" class="link">회원가입</button></p>
</div></section>

<footer><div class="w">Mingle은 준비 중이에요. 프로필과 도시는 예시예요.</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
</body>
</html>
